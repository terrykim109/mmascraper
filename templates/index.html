<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Fight Data Available at your fingertips!</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>UFC Fight Data Available at your fingertips!</h1>

    <div id="controls">
        <input type="text" id="search-box" placeholder="Search fighters..." oninput="applyFilters()">
        <select id="weight-filter" onchange="applyFilters()">
            <option value="">All Weight Classes</option>
            <option>Women's Strawweight</option>
            <option>Flyweight</option>
            <option>Bantamweight</option>
            <option>Featherweight</option>
            <option>Lightweight</option>
            <option>Welterweight</option>
            <option>Middleweight</option>
            <option>Light Heavyweight</option>
            <option>Heavyweight</option>
            <option>Unknown</option>
        </select>
        <select id="sort-filter" onchange="applyFilters()">
            <option value="">Sort By</option>
            <option value="name">Name (A-Z)</option>
            <option value="slpm">Strikes Landed per Min</option>
            <option value="sapm">Strikes Absorbed per Min</option>
            <option value="str_acc">Striking Accuracy</option>
            <option value="str_def">Strike Defence</option>
            <option value="td_avg">Takedown Avg</option>
            <option value="td_acc">Takedown Accuracy</option>
            <option value="td_def">Takedown Defence</option>
            <option value="sub_avg">Submission Avg</option>
        </select>
    </div>

    <p id="status">Loading fighters</p>
    <ul id="fighters-list"></ul>

    <script>
        let allFighters = [];

        fetch('/api/fighters')
            .then(res => res.json())
            .then(data => {
                allFighters = data;
                document.getElementById('status').textContent = `${data.length} fighters loaded`;
                renderFighters(allFighters);
            })
            .catch(err => {
                document.getElementById('status').textContent = 'Failed to load fighters';
                console.error(err);
            });

        function renderFighters(fighters) {
            const ul = document.getElementById('fighters-list');
            ul.innerHTML = '';
            if (fighters.length === 0) {
                ul.innerHTML = '<li>No fighters found</li>';
                return;
            }
            fighters.forEach(f => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <a href="/fighter?url=${encodeURIComponent(f.link)}">${f.name}</a>
                    <span class="weight-class">${f.weight_class}</span>
                `;
                ul.appendChild(li);
            });
        }

        function applyFilters() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const weightClass = document.getElementById('weight-filter').value;
            const sortBy = document.getElementById('sort-filter').value;

            let filtered = allFighters.filter(f => {
                const matchesName = f.name.toLowerCase().includes(query);
                const matchesWeight = weightClass === '' || f.weight_class === weightClass;
                return matchesName && matchesWeight;
            });

            if (sortBy && sortBy !== 'name') {
                console.log("sorting by:", sortBy);
                console.log("sample values:", filtered.slice(0, 5).map(f => ({ name: f.name, val: f[sortBy] })));
            }

            if (sortBy === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortBy) {
                filtered.sort((a, b) => {
                const aVal = parseFloat(a[sortBy]) || 0;
                const bVal = parseFloat(b[sortBy]) || 0;
                return bVal - aVal;
                });
            }

            document.getElementById('status').textContent = `${filtered.length} fighters`;
            renderFighters(filtered);
            }
    </script>
</body>
</html>
